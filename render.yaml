# Render Blueprint for the web service. The PostgreSQL database is hosted on Neon.
# Render dashboard → New → Blueprint → pick this repo, then set DATABASE_URL.
services:
  - type: web
    name: worktrack
    runtime: node
    plan: free
    # Installs the server, then builds the React app into client/dist,
    # which the Express server serves alongside the API.
    buildCommand: >-
      cd server && npm ci && npm run build &&
      cd ../client && npm ci --include=dev && npm run build
    # Applies database migrations, creates the starting accounts if missing, then starts the API.
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The database lives on Neon (free, doesn't expire). Set this secret in the
      # Render dashboard: worktrack → Environment → DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
