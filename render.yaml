# Render Blueprint: creates the database and the web service in one go.
# Render dashboard → New → Blueprint → pick this repo.
databases:
  - name: worktrack-db
    plan: free
    databaseName: worktrack
    user: worktrack

services:
  - type: web
    name: worktrack
    runtime: node
    plan: free
    # Installs the server, then builds the React app into client/dist,
    # which the Express server serves alongside the API.
    buildCommand: >-
      cd server && npm ci && npm run build &&
      cd ../client && npm ci --include=dev && npm run build
    # Applies database migrations, creates the starting accounts if missing, then starts the API.
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: worktrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
